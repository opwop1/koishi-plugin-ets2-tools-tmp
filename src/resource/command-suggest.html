<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>猜你想问</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #06060b;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      width: 560px;
      background: #0a0a12;
      position: relative;
      overflow: hidden;
      padding: 22px 24px 24px;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 0;
    }

    .glow-top {
      position: absolute;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 620px;
      height: 360px;
      background: radial-gradient(ellipse at center, rgba(0, 200, 255, 0.16) 0%, rgba(0, 200, 255, 0.04) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 13px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 200, 255, 0.1);
    }

    .header-badge {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: linear-gradient(145deg, rgba(0, 200, 255, 0.22), rgba(0, 200, 255, 0.06));
      border: 1px solid rgba(0, 200, 255, 0.32);
      box-shadow: 0 0 18px rgba(0, 200, 255, 0.22);
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      color: #eaf6ff;
      letter-spacing: 1.2px;
    }

    .header-title em {
      font-style: normal;
      color: #00c8ff;
      text-shadow: 0 0 14px rgba(0, 200, 255, 0.55);
    }

    .header-sub {
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #3d5570;
      text-transform: uppercase;
    }

    .hint {
      position: relative;
      z-index: 2;
      margin-top: 16px;
      font-size: 12.5px;
      color: #7d8b9c;
      letter-spacing: 0.4px;
    }

    .list {
      position: relative;
      z-index: 2;
      margin-top: 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(0, 255, 157, 0.05);
      border: 1px solid rgba(0, 255, 157, 0.26);
      box-shadow: inset 0 0 20px rgba(0, 255, 157, 0.06);
    }

    .item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, #00ff88, #00c8ff);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }

    .item-idx {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #04121a;
      background: linear-gradient(135deg, #00ff88, #00c8ff);
    }

    .item-name {
      font-size: 15.5px;
      font-weight: 700;
      color: #eaf6ff;
      letter-spacing: 0.4px;
      word-break: break-all;
    }

    .footer {
      position: relative;
      z-index: 2;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 200, 255, 0.08);
      font-size: 10px;
      color: #3d5570;
      letter-spacing: 2.4px;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="container">
  <div class="grid-bg"></div>
  <div class="glow-top"></div>

  <div class="header">
    <div class="header-badge">💡</div>
    <div>
      <div class="header-title">猜你<em>想问</em></div>
      <div class="header-sub">Did You Mean</div>
    </div>
  </div>

  <div class="hint" id="hint">没有找到这条指令，你是不是想用：</div>
  <div class="list" id="list"></div>

  <div class="footer">TMP-BOT · Command Suggest</div>
</div>

<script>
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /**
   * @param {{ names?: string[], input?: string }} data
   */
  function setData(data) {
    data = data || {};
    var names = Array.isArray(data.names) ? data.names : [];
    var hintEl = document.getElementById('hint');
    var listEl = document.getElementById('list');

    if (data.input) {
      hintEl.textContent = '没有找到「' + data.input + '」，你是不是想用：';
    }

    if (names.length === 0) {
      listEl.innerHTML = '<div class="item"><div class="item-name">-</div></div>';
      return;
    }

    listEl.innerHTML = names.map(function (name, i) {
      return '<div class="item">' +
        '<div class="item-idx">' + (i + 1) + '</div>' +
        '<div class="item-name">' + esc(name) + '</div>' +
        '</div>';
    }).join('');
  }
</script>
</body>
</html>
